<header class="barra">
  <button
    type="button"
    class="boton-menu"
    (click)="menu.abierto.set(!menu.abierto())"
    [attr.aria-expanded]="menu.abierto()"
    aria-controls="menu-lateral"
    aria-label="Abrir o cerrar el menú de materias y simuladores"
  >
    <span class="hamburguesa" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
  <a routerLink="/" class="marca">
    <span class="logo">UI</span>
    <span class="marca-titulo">{{ titulo }}</span>
  </a>
  @if (ubicacion(); as u) {
    <div class="ubicacion">
      <span class="materia">{{ u.materia }}</span>
      @if (u.sim) {
        <span class="sep">›</span>
        <span class="sim">{{ u.sim }}</span>
      }
    </div>
  }
  <button type="button" class="boton-tutorial" (click)="tutorial.iniciar()" title="Ver el tutorial de UIFCITO">
    <span class="interrogacion" aria-hidden="true">?</span>
    <span class="etiqueta">Tutorial</span>
  </button>
</header>

<app-sidebar [abierta]="menu.abierto()" (cerrar)="menu.abierto.set(false)" />

<main class="contenido"><router-outlet /></main>

<app-tutorial-uifcito />
