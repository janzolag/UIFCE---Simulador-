<div class="velo" [class.visible]="abierta()" (click)="cerrar.emit()" aria-hidden="true"></div>

<aside id="menu-lateral" class="menu" [class.abierto]="abierta()" [attr.inert]="abierta() ? null : ''" aria-label="Materias y simuladores">
  <div class="menu-cabeza">
    <span class="menu-titulo">Materias y simuladores</span>
    <button type="button" class="cerrar" (click)="cerrar.emit()" aria-label="Cerrar menú">✕</button>
  </div>

  <nav class="menu-nav">
    <a routerLink="/" class="fila inicio" [class.activo]="ruta().materia === ''" (click)="cerrar.emit()">
      <span class="icono icono-inicio">⌂</span>
      <span class="texto">Inicio</span>
    </a>

    @for (m of materias; track m.id) {
      <div class="grupo" [style.--color-materia]="m.color">
        <button
          type="button"
          class="fila materia"
          [class.activo]="ruta().materia === m.id"
          [attr.aria-expanded]="desplegada() === m.id"
          (click)="alternar(m.id)"
        >
          <span class="icono">{{ m.sigla }}</span>
          <span class="texto">{{ m.nombre }}</span>
          <span class="contador" title="Simuladores listos / planeados">{{ listos(m) }}/{{ m.simuladores.length }}</span>
          <span class="flecha" [class.girada]="desplegada() === m.id" aria-hidden="true">›</span>
        </button>

        @if (desplegada() === m.id) {
          <div class="submenu">
            <a [routerLink]="['/', m.id]" class="sub ver-todos" (click)="cerrar.emit()">Ver todos los simuladores →</a>
            @for (s of m.simuladores; track s.id) {
              <a
                [routerLink]="['/', m.id, s.id]"
                class="sub"
                [class.activo]="ruta().materia === m.id && ruta().sim === s.id"
                [class.pendiente]="!s.listo"
                (click)="cerrar.emit()"
              >
                <span class="punto"></span><span>{{ s.nombre }}</span>
              </a>
            }
          </div>
        }
      </div>
    }
  </nav>

  <div class="menu-pie">
    <div>Unidad Informática FCE</div>
    <div class="texto-suave">Universidad Nacional de Colombia</div>
  </div>
</aside>
