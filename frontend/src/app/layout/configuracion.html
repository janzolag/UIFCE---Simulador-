@if (estado.abierto()) {
  <div class="velo-config" (click)="cerrar()" aria-hidden="true"></div>
  <section #panel id="panel-config" class="config" role="dialog" aria-modal="true" aria-labelledby="config-titulo" (keydown)="alTeclearPanel($event)">
    <div class="config-cabeza">
      <h2 id="config-titulo">Configuración</h2>
      <button type="button" class="cerrar" aria-label="Cerrar configuración" (click)="cerrar()">✕</button>
    </div>

    <div class="config-seccion">
      <div class="config-rotulo" id="rotulo-apariencia">Apariencia</div>
      <div class="segmentado" role="radiogroup" aria-labelledby="rotulo-apariencia">
        @for (o of opciones; track o.valor; let i = $index) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="ap.preferencia() === o.valor"
            [attr.tabindex]="ap.preferencia() === o.valor ? 0 : -1"
            (click)="elegir(o.valor)"
            (keydown)="alTeclearTema($event, i)"
          >
            @switch (o.valor) {
              @case ('claro') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="4" />
                  <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
              }
              @case ('oscuro') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
              }
              @default {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="12" rx="2" />
                  <path d="M8 20h8M12 16v4" />
                </svg>
              }
            }
            {{ o.etiqueta }}
          </button>
        }
      </div>
      <p class="config-nota" aria-live="polite">{{ nota() }}</p>
    </div>

    <div class="config-seccion filas">
      <button type="button" class="config-fila" (click)="irAcercaDe()">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v6M12 7.5v.01" />
          </svg>
        </span>
        <span class="txt"><b>Acerca del simulador</b><span>Autor, créditos y agradecimientos</span></span>
        <span class="flecha" aria-hidden="true">›</span>
      </button>
      <button type="button" class="config-fila" (click)="repetirTutorial()">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </span>
        <span class="txt"><b>Repetir el tutorial</b><span>UIFCITO vuelve a mostrarte el simulador</span></span>
        <span class="flecha" aria-hidden="true">›</span>
      </button>
    </div>

    <div class="config-pie"><span>Versión {{ version }} (beta)</span><span>UIFCE · UNAL</span></div>
  </section>
}
