@for (g of visibles(); track $index) {
  <div [class.grupo-controles]="g.titulo">
    @if (g.titulo) {
      <div class="grupo-titulo">{{ g.titulo }}</div>
    }
    @for (c of g.controles; track c.id) {
      <div class="control">
        @if (c.tipo === 'slider') {
          <div class="control-etiqueta">
            <label [for]="'ctl-' + c.id">{{ c.etiqueta }}</label>
            <input
              type="text"
              inputmode="decimal"
              class="valor-num"
              autocomplete="off"
              spellcheck="false"
              [id]="'num-' + c.id"
              [value]="textoNum(c)"
              [attr.aria-label]="c.etiqueta + ' (escribir valor entre ' + c.min + ' y ' + c.max + ')'"
              [attr.title]="'Escribe un valor entre ' + c.min + ' y ' + c.max"
              (change)="alEscribir(c, $event)"
              (keydown.enter)="alEscribir(c, $event)"
              (keydown.escape)="restaurar(c, $event)"
            />
          </div>
          <input
            type="range"
            [id]="'ctl-' + c.id"
            [min]="c.min"
            [max]="c.max"
            [step]="c.paso"
            [value]="valor(c)"
            [style.--p]="porcentaje(c)"
            (input)="alSlider(c, $event)"
          />
        } @else {
          <div class="control-etiqueta">{{ c.etiqueta }}</div>
          <div class="selector" role="radiogroup" [attr.aria-label]="c.etiqueta">
            @for (o of c.opciones; track o.valor) {
              <button
                type="button"
                role="radio"
                class="opcion"
                [class.selected]="valor(c) === o.valor"
                [attr.aria-checked]="valor(c) === o.valor"
                (click)="alElegir(c, o.valor)"
              >
                {{ o.etiqueta }}
              </button>
            }
          </div>
        }
      </div>
    }
  </div>
}
